name: Validate Documentation

# Catches build-breaking docs errors (bad nav entries, missing pages, mkdocstrings
# failures) on PRs BEFORE they merge to main and trigger the self-hosted CT 210 rebuild
# (rascommander.info). Build-only; does not deploy. Strictness also lives in mkdocs.yml.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'ras_commander/**'
      - '.claude/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-revision-date-localized plugin needs history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -r docs/requirements-docs.txt
          CI=1 pip install -e .

      - name: Validate notebook inventory
        run: |
          python .claude/scripts/generate_notebooks_metadata.py --check
          python .claude/scripts/validate_notebooks_yml.py

      - name: Prepare notebooks for docs
        run: |
          python .claude/scripts/prepare_notebooks_for_docs.py

      - name: Generate examples index table
        run: |
          python .claude/scripts/generate_examples_index.py
          git diff --exit-code -- docs/examples/index.md

      - name: Generate cognitive infrastructure docs
        run: |
          python .claude/scripts/generate_cognitive_docs.py

      - name: Build — no deploy
        run: |
          mkdocs build --strict
