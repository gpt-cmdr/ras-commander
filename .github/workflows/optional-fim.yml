name: Optional FIM engine

on:
  pull_request:
    paths:
      - 'ras_commander/fim/**'
      - 'ras_commander/schemas.py'
      - 'ras_commander/__init__.py'
      - 'tests/test_ras_fim.py'
      - 'tests/test_ras_fim_horizontal.py'
      - 'tests/test_ras_fim_prepared_sloping.py'
      - 'tests/test_ras_fim_sloping.py'
      - 'tests/test_fast_map_distribution.py'
      - 'tests/test_fim_corner_preparation.py'
      - 'tests/test_fim_corner_cache.py'
      - 'tests/test_fim_supplied_wsel*.py'
      - 'tests/test_fim_aoi_lattice*.py'

      - 'tests/test_fim_terrain_scope_adr_velocity.py'
      - 'tests/test_fim_invalid_cells.py'
      - 'setup.py'
      - '.github/workflows/optional-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-interface:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[fim,compute]' pytest
      - name: Inspect installed external engine
        run: ras2fim-batch method
      - name: Invalid 2D cell polygon policies
        run: python -m pytest tests/test_fim_invalid_cells.py -q
      - name: Python adapter and installed horizontal engine
        shell: bash
        run: |
          python -c "import os, shutil, pytest; os.environ['RAS_COMMANDER_FIM_HORIZONTAL_ENGINE'] = shutil.which('ras2fim-batch'); raise SystemExit(pytest.main(['tests/test_ras_fim.py', 'tests/test_fast_map_distribution.py', 'tests/test_ras_fim_horizontal.py', 'tests/test_ras_fim_sloping.py', 'tests/test_ras_fim_prepared_sloping.py', 'tests/test_fim_corner_preparation.py', 'tests/test_fim_corner_cache.py', 'tests/test_fim_supplied_wsel.py', 'tests/test_fim_supplied_wsel_real.py', 'tests/test_fim_aoi_lattice.py', 'tests/test_fim_aoi_lattice_real.py', 'tests/test_fim_terrain_scope_adr_velocity.py', '-q']))"
