name: Optional FIM engine

# Linux and Windows run on CLB's self-hosted Slurm runners (clb-ci-linux,
# clb-ci-windows). Pull requests from forks always use GitHub-hosted runners.
on:
  pull_request:
    paths:
      - 'ras_commander/fim/**'
      - 'ras_commander/schemas.py'
      - 'ras_commander/__init__.py'
      - 'ras_commander/RasMap.py'
      - 'ras_commander/RasProcess.py'
      - 'ras_commander/hdf/HdfXsec.py'
      - 'ras_commander/native/RasStoreMapHelper.*'
      - 'tests/test_fim*.py'
      - 'tests/test_one_d*.py'
      - 'tests/test_native_storage_rings.py'
      - 'tests/test_steady*.py'
      - 'tests/test_ras_fim.py'
      - 'tests/test_ras_fim_horizontal.py'
      - 'tests/test_ras_fim_prepared_sloping.py'
      - 'tests/test_ras_fim_sloping.py'
      - 'tests/test_fast_map_distribution.py'
      - 'tests/test_fim_boundary_*.py'
      - 'tests/test_fim_corner_preparation.py'
      - 'tests/test_fim_corner_cache.py'
      - 'tests/test_fim_supplied_wsel*.py'
      - 'tests/test_fim_aoi_lattice*.py'

      - 'tests/test_fim_terrain_scope_adr_velocity.py'
      - 'tests/test_fim_invalid_cells.py'
      - 'tests/test_fim_catalog*.py'
      - 'tests/test_fim_retained_state.py'
      - 'tests/test_fim_effective_terrain.py'
      - 'tests/test_fim_storage_areas.py'
      - 'setup.py'
      - '.github/workflows/optional-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-interface:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
        include:
          - os: ubuntu-latest
            self_hosted: '["self-hosted", "Linux", "X64", "clb-ci-linux"]'
          - os: windows-latest
            self_hosted: '["self-hosted", "Windows", "X64", "clb-ci-windows"]'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('["{0}"]', matrix.os) || matrix.self_hosted || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the current public package index
        run: python -m pip install --no-cache-dir --index-url https://pypi.org/simple -e '.[fim,compute]' pytest setuptools
      - name: Inspect installed external engine
        run: ras2fim-batch method
      - name: Canonical preparation, mapping contracts and failure handling
        run: >-
          python -m pytest
          tests/test_fim_affine_requirement.py
          tests/test_fim_capabilities.py
          tests/test_fim_model_scope.py
          tests/test_fim_one_d.py
          tests/test_fim_one_d_steady_storage.py
          tests/test_fim_coupled.py
          tests/test_fim_coupled_contract.py
          tests/test_fim_coupled_native_grid.py
          tests/test_fim_grid_admission.py
          tests/test_fim_manifest_precision.py
          tests/test_fim_engine_failures.py
          tests/test_fim_sloping_failure_report.py
          tests/test_fim_temporal_crs_identity.py
          tests/test_native_storage_rings.py
          tests/test_one_d_aoi_lattice.py
          tests/test_one_d_api_contract.py
          tests/test_one_d_hdf_contract.py
          tests/test_one_d_lifecycle.py
          tests/test_one_d_zero_stationing.py
          tests/test_steady_map_resource_admission.py
          tests/test_steady_profile_stored_maps.py
          -q
      - name: Invalid 2D cell polygon policies
        run: python -m pytest tests/test_fim_invalid_cells.py -q
      - name: Catalog admission and bounded native HDF staging
        run: python -m pytest tests/test_fim_catalog.py tests/test_fim_catalog_real.py tests/test_fim_retained_state.py -q
      - name: Python adapter and installed horizontal engine
        shell: bash
        run: |
          python -c "import os, shutil, pytest; os.environ['RAS_COMMANDER_FIM_HORIZONTAL_ENGINE'] = shutil.which('ras2fim-batch'); raise SystemExit(pytest.main(['tests/test_ras_fim.py', 'tests/test_fast_map_distribution.py', 'tests/test_ras_fim_horizontal.py', 'tests/test_ras_fim_sloping.py', 'tests/test_ras_fim_prepared_sloping.py', 'tests/test_fim_corner_preparation.py', 'tests/test_fim_corner_cache.py', 'tests/test_fim_supplied_wsel.py', 'tests/test_fim_supplied_wsel_real.py', 'tests/test_fim_aoi_lattice.py', 'tests/test_fim_aoi_lattice_real.py', 'tests/test_fim_terrain_scope_adr_velocity.py', 'tests/test_fim_boundary_inputs.py', 'tests/test_fim_boundary_api.py', 'tests/test_fim_boundary_comparison.py', 'tests/test_fim_storage_areas.py', 'tests/test_fim_effective_terrain.py', 'tests/test_fim_shear_stress.py', '-q']))"
