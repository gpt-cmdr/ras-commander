name: Engine wheels

on:
  push:
    branches: ['feat/optional-fim-mapping-engine']
    paths: ['rust/step05/**', 'ras_commander/fim/**', 'ras_commander/schemas.py', '.github/workflows/engine-wheels.yml', 'tests/smoke_engine_wheel.py', 'tests/test_ras_fim_horizontal.py', 'tests/verify_wheel_artifacts.py', 'wheels/**']
  pull_request:
    paths: ['rust/step05/**', 'ras_commander/fim/**', 'ras_commander/schemas.py', '.github/workflows/engine-wheels.yml', 'tests/smoke_engine_wheel.py', 'tests/test_ras_fim_horizontal.py', 'tests/verify_wheel_artifacts.py', 'wheels/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/verify_wheel_artifacts.py
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.99.1'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --manifest-path rust/step05/Cargo.toml --out dist
      - name: Install and test the built wheel
        shell: bash
        run: |
          python -m pip install --no-deps --no-index --find-links dist ras2fim-engine
          python -m pip install numpy==2.3.5 scipy==1.16.3 rasterio==1.4.4
          python tests/smoke_engine_wheel.py
          python -m pip install -e '.[fim]' pytest psutil
          python -c "import os, shutil, pytest; os.environ['RAS_COMMANDER_FIM_HORIZONTAL_ENGINE'] = shutil.which('ras2fim-batch'); raise SystemExit(pytest.main(['tests/test_ras_fim_horizontal.py', '-q']))"
      - name: Rust engine regression tests
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 test --locked --manifest-path rust/step05/Cargo.toml
      - name: Hash wheel artifacts
        shell: python
        run: |
          import hashlib, pathlib
          paths = sorted(pathlib.Path('dist').glob('*.whl'))
          assert len(paths) == 1, paths
          pathlib.Path('dist/SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in paths))
      - uses: actions/upload-artifact@v4
        with:
          name: ras2fim-engine-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
