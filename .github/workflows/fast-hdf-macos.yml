name: Native HDF extension (macOS arm64, manual)

# GitHub-hosted macOS arm64 (macos-15) leg of fast-hdf.yml. It is slow and paid,
# so this workflow has no automatic trigger: it runs only from a manual dispatch
# with include_macos set to true (off by default), and only after the maintainer
# approves that specific run. A dispatch with the default input skips the job.
# Linux and Windows run in fast-hdf.yml on CLB's self-hosted runners.
#
# The job steps are mirrored from fast-hdf.yml (job `native`): keep the two files
# in sync. They are separate files because the CI-runner policy check proves
# runners per workflow file, without evaluating job `if`.
on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Run on GitHub-hosted macOS arm64 (macos-15); needs maintainer approval"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-macos:
    name: native (macos-15)
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ras-commander and test dependencies
        env:
          CI: '1'
        run: python -m pip install --only-binary rasterio,scipy . pytest xarray geopandas shapely pyproj rasterio scipy
      # ras-commander already installs the extension as a core dependency on these
      # runners (Windows x64, Linux x64, macOS arm64). This step confirms a wheel
      # is present and never builds the extension from source; on a platform
      # without a wheel the native steps are skipped.
      - name: Install ras-commander-fast-hdf from PyPI
        id: native
        shell: bash
        run: |
          if python -m pip install --only-binary ras-commander-fast-hdf "ras-commander-fast-hdf>=0.5.0,<0.6"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Native tests skipped::ras-commander-fast-hdf >=0.5.0,<0.6 could not be installed from PyPI for this platform."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Adapter compatibility with the published extension
        if: steps.native.outputs.available == 'true'
        run: python -m pytest tests/test_hdf_plan_geometry_information.py tests/test_hdf_mesh_ghost_cells.py tests/test_fast_hdf.py tests/test_fim_catalog.py -k "legacy_names_and_ghost_filtering or adapter_accepts_only_compatible_native_contracts or bounded_multitime_hdf_read" -q
      - name: Check the installed extension
        if: steps.native.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import ras_commander_fast_hdf as native
          from ras_commander import fast_hdf
          print("ras-commander-fast-hdf", metadata.version("ras-commander-fast-hdf"),
                "API", native.API_VERSION, "ENGINE_COMMIT", native.ENGINE_COMMIT)
          assert native.API_VERSION == 12
          assert fast_hdf.available(), "ras_commander.fast_hdf must accept the installed extension"
          names = {f.name for f in metadata.distribution("ras-commander-fast-hdf").files
                   if ".dist-info/licenses/" in f.as_posix()}
          missing = {"THIRD-PARTY-NOTICES.md", "ras-commander-LICENSE.txt", "ras-commander-fast-hdf-LICENSE.txt"} - names
          assert not missing, f"wheel licence files missing: {missing}"
          PY
      - name: Binding and fallback regression tests
        if: steps.native.outputs.available == 'true'
        run: python -m pytest tests/test_hdf_plan_geometry_information.py tests/test_hdf_mesh_ghost_cells.py tests/test_fast_hdf.py tests/test_fast_hdf_pmtiles_columnar.py tests/test_hdf_result_view.py tests/test_hdf_results_mesh.py tests/test_hdf_mesh_cell_polygon_diagnostics.py tests/rust_engine_bridge/panic_guard_test.py tests/rust_engine_bridge/in_call_rewrite_test.py -q
      - name: Raster interpolation regression tests
        run: python -m pytest tests/test_hdf_raster_interpolation.py tests/test_hdf_raster_triangulation.py tests/test_hdf_raster_windows.py tests/test_hdf_results_mesh_max_depth.py -q
      - name: Table readers with Python reference backend
        env:
          RAS_COMMANDER_FAST_HDF: python
        run: python -m pytest tests/test_tabular_readers_core_install.py -q
      - name: Table readers with required native backend
        if: steps.native.outputs.available == 'true'
        env:
          RAS_COMMANDER_FAST_HDF: required
        run: python -m pytest tests/test_tabular_readers_core_install.py -q
