name: Native HDF extension

# The native extension (ras-commander-fast-hdf) is built and released from
# https://github.com/gpt-cmdr/ras-commander-fast-hdf. This workflow installs the
# published wheel from PyPI and runs ras-commander's binding and fallback tests
# against it. It builds nothing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ras_commander/fast_hdf.py'
      - 'ras_commander/_fast_hdf_typed.py'
      - 'ras_commander/fast_results.py'
      - 'ras_commander/fast_text.py'
      - 'ras_commander/hdf/HdfMesh.py'
      - 'ras_commander/hdf/HdfResultsMesh.py'
      - 'ras_commander/hdf/HdfResultView.py'
      - 'setup.py'
      - 'tests/test_hdf_result_view.py'
      - 'tests/test_fast_hdf*.py'
      - 'tests/rust_engine_bridge/**'
      - 'tests/native_engine_provenance.py'
      - '.github/workflows/fast-hdf.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ras-commander and test dependencies
        env:
          CI: '1'
        run: python -m pip install . pytest xarray geopandas shapely pyproj rasterio scipy
      # Wheels only: never build the extension from source here. Until the package
      # is published (or for a platform without a wheel) the native steps are skipped.
      - name: Install ras-commander-fast-hdf from PyPI
        id: native
        shell: bash
        run: |
          if python -m pip install --only-binary ras-commander-fast-hdf "ras-commander-fast-hdf==0.1.*"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Native tests skipped::ras-commander-fast-hdf 0.1.* could not be installed from PyPI for this platform."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the installed extension
        if: steps.native.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import ras_commander_fast_hdf as native
          from ras_commander import fast_hdf
          print("ras-commander-fast-hdf", metadata.version("ras-commander-fast-hdf"),
                "API", native.API_VERSION, "ENGINE_COMMIT", native.ENGINE_COMMIT)
          assert native.API_VERSION == 11
          assert fast_hdf.available(), "ras_commander.fast_hdf must accept the installed extension"
          names = {f.name for f in metadata.distribution("ras-commander-fast-hdf").files
                   if ".dist-info/licenses/" in f.as_posix()}
          missing = {"THIRD-PARTY-NOTICES.md", "ras-commander-LICENSE.txt", "ras-commander-rust-LICENSE.txt"} - names
          assert not missing, f"wheel licence files missing: {missing}"
          PY
      - name: Binding and fallback regression tests
        if: steps.native.outputs.available == 'true'
        run: python -m pytest tests/test_fast_hdf.py tests/test_hdf_result_view.py tests/test_hdf_results_mesh.py tests/test_hdf_mesh_cell_polygon_diagnostics.py tests/rust_engine_bridge/panic_guard_test.py -q
