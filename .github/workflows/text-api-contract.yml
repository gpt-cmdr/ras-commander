name: Text API contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public library and focused test runner
        run: python -m pip install -e . pytest
      - name: Check text API and geometry infiltration write safety
        run: python -m pytest tests/ras_text_read_only_test.py tests/test_clear_geometry_infiltration.py tests/test_geometry_association_inventory.py -q
