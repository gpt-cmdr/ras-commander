name: Native DSS engine

# Offline tests of RasDss and RasDssGrid on the optional ras-commander-fast-dss
# engine, installed from PyPI through the dss-native extra. No HEC-RAS, no test
# data from the network and no private files: tests that need them skip.
#
# native: RAS_COMMANDER_DSS_BACKEND=native, no Java installed. The guard step
#   fails the job if the engine is not the one from PyPI or if the native
#   wrapper modules did not run (scripts/ci/native_dss_ci_guard.py).
# shadow (Windows only, see the matrix): adds a JDK, pyjnius and HEC Monolith
#   (downloaded by ras-commander from HEC's public Nexus and Maven Central before
#   the tests, cached between runs), so the Java-path comparisons run too.
#
# Every job runs on CLB's self-hosted Slurm runners (clb-ci-linux,
# clb-ci-windows). There is no GitHub-hosted fallback: pull requests from forks
# skip the job (shown as skipped), and a maintainer runs the checks from a branch
# in this repository instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-plan:
    name: CI change plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clb-ci-linux]
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      public: ${{ steps.plan.outputs.public }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Verify conservative selection rules
        run: python3 -m unittest discover -s .github/scripts -p test_ci_plan.py
      - id: plan
        env:
          CI_FULL: ${{ vars.CLB_CI_FULL }}
        run: python3 .github/scripts/ci_plan.py

  native-dss:
    needs: change-plan
    name: native-dss (${{ matrix.os }}, ${{ matrix.backend }})
    if: ${{ !cancelled() && (needs.change-plan.result != 'success' || needs.change-plan.outputs.heavy != 'false') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 45
    runs-on: ${{ fromJSON(matrix.self_hosted) }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit rows with literal runner labels (no axes, no exclude), so the
        # runner for every job is statically verifiable.
        # HEC's Linux native library (javaHeclib 7-IU-8, HEC Monolith 3.3.27)
        # aborts intermittently in DSS6 time-series writes ("Substring out of
        # bounds" in zsrtsi6.f), which the Java path of the shadow tests uses.
        # Shadow runs on Windows; Linux runs the native leg.
        include:
          - os: linux
            backend: native
            self_hosted: '["self-hosted","Linux","X64","clb-ci-linux"]'
          - os: windows
            backend: native
            self_hosted: '["self-hosted","Windows","X64","clb-ci-windows"]'
          - os: windows
            backend: shadow
            self_hosted: '["self-hosted","Windows","X64","clb-ci-windows"]'
    env:
      CI: '1'
      PYTHONUTF8: '1'
      RAS_COMMANDER_DSS_BACKEND: ${{ matrix.backend }}
    steps:
      - name: Require a valid admission receipt
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.change-plan.result }}
          PLAN_HEAVY: ${{ needs.change-plan.outputs.heavy }}
        run: test "$PLAN_RESULT" = success && { test "$PLAN_HEAVY" = true || test "$PLAN_HEAVY" = false; }
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the library with the dss-native extra
        shell: bash
        # pydsstools (in dss-native) needs NumPy 1.x on CPython 3.12.
        run: >-
          python .github/scripts/ci_time.py dependencies -- python -m pip install "numpy<2" -e ".[dss-native]"
          pytest nbformat requests setuptools matplotlib geopandas "shapely>=2.0"
          xarray rasterio scipy tqdm psutil

      - name: Set up Java (shadow)
        if: matrix.backend == 'shadow'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pyjnius (shadow)
        if: matrix.backend == 'shadow'
        run: python -m pip install pyjnius

      - name: Cache HEC Monolith (shadow)
        if: matrix.backend == 'shadow'
        uses: actions/cache@v4
        with:
          path: ~/.ras-commander/dss
          key: hec-monolith-3.3.27-javaHeclib-7-IU-8-${{ runner.os }}

      - name: Download HEC Monolith before the tests (shadow)
        if: matrix.backend == 'shadow'
        run: python -c "from ras_commander.dss._hec_monolith import HecMonolithDownloader as D; d = D(); d.install(); assert d.is_installed(); print(d.get_info())"

      - name: Check the installed engine
        run: python scripts/ci/native_dss_ci_guard.py engine

      - name: Run the DSS and wrapper tests
        shell: bash
        run: |
          files=$(ls tests/test_*dss*.py tests/test_hec_monolith_logging.py \
            tests/test_precip_mrms*.py tests/test_compute_extra.py \
            tests/test_rascontrol_cleanup_console_encoding.py | grep -v hecras_acceptance)
          python .github/scripts/ci_time.py native-dss-tests -- python -m pytest $files -m "not real_ras" -q -rs -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/pytest-dss" --junitxml="$RUNNER_TEMP/native-dss.xml"

      - name: Fail if the native tests did not run
        if: always()
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.backend }}" = "shadow" ]; then extra="--java"; fi
          python scripts/ci/native_dss_ci_guard.py junit "$RUNNER_TEMP/native-dss.xml" --min-passed 600 $extra
