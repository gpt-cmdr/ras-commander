name: Publish PyPI Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed or annotated release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a vMAJOR.MINOR.PATCH tag" >&2; exit 1 ;;
          esac

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install --upgrade build twine
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          setup_text = Path("setup.py").read_text(encoding="utf-8")
          match = re.search(r'^\s*version="([^"]+)"', setup_text, re.MULTILINE)
          if match is None or match.group(1) != expected:
              raise SystemExit(
                  f"Tag version {expected!r} does not match setup.py: "
                  f"{None if match is None else match.group(1)!r}"
              )
          PY
          python -m build
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
