name: Publish PyPI Release

# Trusted publishing (PyPI OIDC): no API token. The publish job exchanges this workflow's
# GitHub OIDC identity for a short-lived PyPI token, which PyPI accepts only for the trusted
# publisher registered for this repository, this workflow file (publish-pypi.yml) and the `pypi`
# environment. PEP 740 attestations are generated and uploaded with the files.
#
# Publishing runs only for a vMAJOR.MINOR.PATCH tag, either pushed or named in a manual dispatch,
# only when the repository variable PUBLISH_PYPI is 'true', and only after the `pypi`
# environment's required reviewers approve.
#
# The release gate (.github/scripts/release_version_gate.py) always runs from this workflow's own
# commit (github.workflow_sha), checked out separately from the source being built. The source,
# and so every published file, comes only from the tag. A manual dispatch can therefore publish
# an existing tag that predates the gate script.
#
# Pull requests that touch packaging run the build job twice as a dry run, publishing nothing:
# `head` builds the pull request against its declared version, and `latest-tag` builds the newest
# existing vMAJOR.MINOR.PATCH tag through exactly the path a manual dispatch uses.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/publish-pypi.yml
      - .github/scripts/release_version_gate.py
      - pyproject.toml
      - setup.py
      - MANIFEST.in

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  DIST_NAME: ras-commander
  VERSION_MODULE: ras_commander/__init__.py

jobs:
  build:
    name: Build and check distributions (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # release: the tag being published (tag push or manual dispatch); the only target whose
        # files are uploaded. head / latest-tag: pull-request dry runs.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["head","latest-tag"]') || fromJSON('["release"]') }}
    steps:
      - name: Resolve the source ref
        id: resolve
        env:
          TARGET: ${{ matrix.target }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'
          case "$TARGET" in
            release)
              tag="${PUSHED_TAG:-$INPUT_TAG}"
              [[ "$tag" =~ $tag_re ]] || { echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"; exit 1; }
              ;;
            latest-tag)
              tag="$(git ls-remote --tags --refs "$REPO_URL" 'v*' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              [[ "$tag" =~ $tag_re ]] || { echo "::error::no existing vMAJOR.MINOR.PATCH tag found"; exit 1; }
              ;;
            head)
              tag="" ;;  # the pull request's own source; tag set from its declared version below
            *) echo "::error::unknown target $TARGET"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TARGET_TAG=$tag" >> "$GITHUB_ENV"
          echo "target=$TARGET tag=${tag:-<declared>}"

      - name: Check out the release gate (this workflow's own commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Two separate checkouts: release and latest-tag build only from a validated tag; the
      # pull-request source is checked out only for the head dry run.
      - name: Check out the tag to build
        if: ${{ matrix.target != 'head' }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          path: src
          persist-credentials: false

      - name: Check out the pull request (head dry run)
        if: ${{ matrix.target == 'head' }}
        uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pull request head - check against the declared version
        if: ${{ matrix.target == 'head' }}
        working-directory: src
        run: echo "TARGET_TAG=$(python ../gate/.github/scripts/release_version_gate.py declared)" >> "$GITHUB_ENV"

      - name: Check the tag against the declared versions
        working-directory: src
        run: python ../gate/.github/scripts/release_version_gate.py source --tag "$TARGET_TAG" --init "$VERSION_MODULE"

      - name: Build sdist and wheel
        working-directory: src
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --sdist --wheel --outdir ../dist

      - name: Check the built versions
        run: python gate/.github/scripts/release_version_gate.py dist --tag "$TARGET_TAG" --dist dist --name "$DIST_NAME"

      - name: twine check
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        if: ${{ matrix.target == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: ${{ vars.PUBLISH_PYPI == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ras-commander/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      # No password: the action uses the PyPI trusted publisher for this workflow. The old
      # PYPI_API_TOKEN repository secret is deliberately not referenced (attestations are
      # ignored when a token is used); it stays in place until the maintainer revokes it.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
