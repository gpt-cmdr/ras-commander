name: Commander plugin contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging>=24,<27'
      - name: Validate package and release-maintenance contracts
        run: python -m unittest discover -s scripts/agent_framework/tests -v
      - name: Generate and check shared discovery bridge
        run: |
          python scripts/agent_framework/sync_codex_skill_bridge.py
          python scripts/agent_framework/sync_codex_skill_bridge.py --check
      - name: Assemble portable candidate from canonical sources
        run: python scripts/agent_framework/build_plugin.py --output "${{ runner.temp }}/commander-plugin"
      - uses: actions/upload-artifact@v4
        with:
          name: commander-plugin-validated-candidate
          path: ${{ runner.temp }}/commander-plugin
