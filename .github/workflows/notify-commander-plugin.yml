name: Notify Commander plugin

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-commander-plugin
  cancel-in-progress: false

jobs:
  notify:
    # CLB self-hosted Linux runner, no GitHub-hosted fallback. The runner image has
    # curl and jq but not the gh CLI, so the dispatch is a plain REST call.
    runs-on: ["self-hosted", "Linux", "X64", "clb-ci-linux"]
    timeout-minutes: 5
    steps:
      - name: Notify the plugin repository of library changes
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          LIBRARY_REPOSITORY: ${{ github.repository }}
          LIBRARY_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set PLUGIN_DISPATCH_TOKEN with Contents: write on gpt-cmdr/ras-commander-plugin."
            exit 1
          fi
          event_type=library-main-updated
          if [ "$EVENT_NAME" = release ]; then
            event_type=library-release
          fi
          payload=$(jq -n \
            --arg event_type "$event_type" \
            --arg repository "$LIBRARY_REPOSITORY" \
            --arg commit "$LIBRARY_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            '{event_type: $event_type, client_payload: {repository: $repository, commit: $commit, tag: $tag}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/gpt-cmdr/ras-commander-plugin/dispatches
