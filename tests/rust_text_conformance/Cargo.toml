[package]
name = "ras-text-conformance"
version = "0.0.0"
edition = "2021"
publish = false
description = "Standalone conformance harness for python/src/ras_text of ras-commander-fast-hdf (set RAS_FAST_HDF_SOURCE; no PyO3)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ras_text_probe"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Keep this crate out of any parent workspace.
[workspace]
