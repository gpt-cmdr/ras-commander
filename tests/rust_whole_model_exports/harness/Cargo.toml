[package]
name = "ras-whole-export-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The export crate lives in python/src/exports of gpt-cmdr/ras-commander-fast-hdf (0.1.0).
ras-export = { git = "https://github.com/gpt-cmdr/ras-commander-fast-hdf", rev = "7ca433ea4fbe68902a50902de815e56697eb21b2", features = ["geojson", "flatgeobuf", "geoparquet", "geopackage"] }
arrow-ipc = "=59.0.0"
arrow-array = "=59.0.0"
serde_json = "1"

[[bin]]
name = "whole-export-harness"
path = "main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
