[package]
name = "ras-whole-export-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ras-export = { path = "../../../rust/fast-hdf/src/exports", features = ["geojson", "flatgeobuf", "geoparquet", "geopackage"] }
arrow-ipc = "=59.0.0"
