[package]
name = "typed-pmtiles-qualification-harness"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
# The export crate lives in python/src/exports of gpt-cmdr/ras-commander-fast-hdf (0.1.0).
ras-export = { git = "https://github.com/gpt-cmdr/ras-commander-fast-hdf", rev = "7ca433ea4fbe68902a50902de815e56697eb21b2", features = ["all-writers", "pmtiles"] }
serde_json = "1"
[[bin]]
name = "typed-export-harness"
path = "main.rs"
