[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "ras2fim-engine"
version = "0.3.0"
description = "Optional Rust engine for ras2fim-2D Step05 catalog mapping"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[tool.maturin]
bindings = "bin"
strip = true
include = ["THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
