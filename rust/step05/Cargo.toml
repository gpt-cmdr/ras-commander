[package]
name = "ras2fim-stages-r2"
version = "0.7.0"
edition = "2024"
license = "MIT"
publish = false
description = "Optional ras2fim-2D Step05 raster engine over globally prepared SciPy topology, transforms and wet masks."

[[bin]]
name = "ras2fim-batch"
path = "src/main.rs"

[dependencies]
# Native terrain and polygon rasterization; GDAL remains disabled.
terrio = { version = "=0.4.2", default-features = false, features = ["geotiff"] }
wbvector = "=0.1.6"
wbraster = "=0.2.1"
rayon = "1.10"
rstar = "=0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
