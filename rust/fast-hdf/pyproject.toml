[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ras-commander-fast-hdf"
version = "0.1.0"
description = "Optional Rust acceleration for ras-commander"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"
license-files = ["licenses/*"]

[tool.maturin]
module-name = "ras_commander_fast_hdf"
features = ["extension-module"]
