[package]
name = "ras-commander-fast-hdf"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional native numeric HDF, mesh topology, and PMTiles kernels for ras-commander"

[lib]
name = "ras_commander_fast_hdf"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
ndarray = "0.17"
rayon = "1.10"
prost = "0.13"
i_overlay = "=1.9.4"
i_float = "=1.6.0"
hdf5-reader = { git = "https://github.com/gpt-cmdr/netcdf-rust", rev = "24ff6fcfcc79a35c30aa5d8cb3028ab4d9d00564" }
freestiler-core = { git = "https://github.com/walkerke/freestiler", rev = "beb64b0d4414da895ec67d02b2f91db6ab6acc37" }
# Fast Rust zlib implementation; features unify with both upstream readers.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
