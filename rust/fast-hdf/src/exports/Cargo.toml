[package]
name = "ras-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[lib]
path = "lib.rs"

[features]
default = []
pmtiles = ["dep:freestiler-core", "dep:geozero", "geozero/with-geo"]
geojson = ["dep:geozero"]
flatgeobuf = ["dep:flatgeobuf", "dep:geozero"]
geoparquet = ["dep:geoparquet", "dep:parquet"]
geopackage = ["dep:geopackage"]
all-writers = ["geojson", "flatgeobuf", "geoparquet", "geopackage"]

[dependencies]
arrow-array = "=59.0.0"
arrow-schema = "=59.0.0"
arrow-ipc = "=59.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
geozero = { version = "=0.15.1", optional = true, default-features = false, features = ["with-wkb", "with-geojson"] }
flatgeobuf = { version = "=6.0.1", optional = true, default-features = false }
geoparquet = { version = "=0.9.0", optional = true }
parquet = { version = "=59.0.0", optional = true, default-features = false, features = ["arrow", "snap"] }
geopackage = { version = "=0.10.0", optional = true, default-features = false, features = ["arrow", "bundled"] }

freestiler-core = { git = "https://github.com/walkerke/freestiler", rev = "beb64b0d4414da895ec67d02b2f91db6ab6acc37", optional = true }
